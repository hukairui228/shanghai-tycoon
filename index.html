<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="商海浮沉 · 上海贸易帝国模拟：跨港套利、A 股、合同、澳门，与 AI 财团争夺富豪榜。">
<title>商海浮沉 · 上海贸易帝国</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体异步加载：国内网络访问 Google Fonts 会阻塞首屏，失败时自动回落到系统字体 -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Private-office terminal: ink ground, champagne hairlines, banknote guilloche. Desks open as framed windows. Red up / green down (A-share). Single deliberate dark look. */
:root{
  color-scheme:dark;
  --bg:#0b0d10; --surface:#13161b; --surface2:#181c22; --raise:#1e232a;
  --hair:rgba(200,169,106,.22); --hair2:rgba(236,230,218,.08); --hair3:rgba(236,230,218,.14);
  --ink:#ece6da; --muted:#8f8a80; --faint:#5f5c56; --gold:#c8a96a; --gold-hi:#e4cb93;
  --up:#d8604e; --down:#4f9f80; --felt:#0d3528; --felt2:#082219;
  --f-serif:"Noto Serif SC","Songti SC",serif; --f-fig:"Cormorant Garamond","Noto Serif SC",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.m{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fig{font-family:var(--f-fig);font-variant-numeric:lining-nums tabular-nums;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .gold{color:var(--gold)}
.cap{font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;width:100%}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

.top{border-bottom:1px solid var(--hair2);background:rgba(11,13,16,.82);backdrop-filter:blur(10px);flex:none}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 200px;background:none;border:0;padding:0;text-align:left;overflow:hidden}
.mono{width:44px;height:44px;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--f-serif);font-size:20px;color:var(--gold);flex:none;position:relative}
.mono::after{content:"";position:absolute;inset:3px;border:1px solid var(--hair)}
.mark .co{font-family:var(--f-serif);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.mark .ti{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.xp{width:90px;height:2px;background:var(--hair2);position:relative}
.xp i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.figs{display:flex;gap:20px;flex:none}
.figs div{display:flex;flex-direction:column}
.figs b{font-family:var(--f-fig);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:lining-nums}
.ctl{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.date{text-align:right}
.date .d{font-family:var(--f-mono);font-size:13px}
.date .w{font-size:11px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--hair3);border-radius:3px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 10px;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.seg button+button{border-left:1px solid var(--hair2)}
.seg button.on{background:var(--gold);color:#16120a}
.ib{width:32px;height:32px;border:1px solid var(--hair3);border-radius:3px;background:none;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:16px;height:16px}
.dayline{height:1px;background:var(--hair2);position:relative;overflow:hidden}
.dayline i{position:absolute;inset:0 auto 0 0;background:var(--gold);opacity:.7}

.hub{flex:1;overflow:auto;padding-block:22px 28px}
.hub .wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--hair2);margin-bottom:18px;flex-wrap:wrap}
.hero .big{font-family:var(--f-fig);font-size:clamp(40px,6vw,64px);font-weight:600;line-height:1;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.hero .chg{font-family:var(--f-mono);font-size:13px;margin-top:6px}
.hero canvas{width:min(360px,100%);height:70px}
.desks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.desk{position:relative;text-align:left;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--hair2);border-radius:4px;padding:16px 16px 14px;min-height:136px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.desk:hover{border-color:var(--hair);transform:translateY(-1px)}
.desk .row1{display:flex;justify-content:space-between;align-items:flex-start}
.desk svg.ic{width:30px;height:30px;color:var(--gold)}
.desk h3{font-family:var(--f-serif);font-weight:600;font-size:18px;margin:6px 0 0;letter-spacing:.02em}
.desk .st{font-size:12.5px;color:var(--muted);margin-top:auto}
.desk .st b{color:var(--ink);font-weight:500}
.desk .dot{font:500 11px var(--f-mono);color:#16120a;background:var(--gold);border-radius:2px;padding:0 6px;line-height:18px}
.desk.lock{opacity:.5}
.desk.macau{grid-column:span 2;background:radial-gradient(120% 140% at 85% 0%,rgba(122,30,40,.5),transparent 60%),linear-gradient(180deg,#1b1417,#131013);border-color:rgba(200,169,106,.3)}
.desk.macau h3{font-size:22px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:rgba(19,22,27,.9);border:1px solid var(--hair2);border-radius:4px;padding:16px;min-width:0}
.panel h4{margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-serif);font-weight:600;font-size:15px}
.mini-t{width:100%;border-collapse:collapse;font-size:12.5px}
.mini-t td{padding:5px 0;border-bottom:1px solid var(--hair2)}
.mini-t td:nth-child(2),.mini-t td:nth-child(3){text-align:right;font-family:var(--f-mono)}
.feed{display:flex;flex-direction:column;gap:9px;max-height:300px;overflow:auto}
.feed .it{font-size:12.5px;line-height:1.5;padding-left:10px;border-left:1px solid var(--hair3);color:#cfc9bd}
.feed .it.good{border-color:var(--up)} .feed .it.bad{border-color:var(--down)} .feed .it.gold{border-color:var(--gold)} .feed .it.rumor{border-color:var(--gold);color:var(--gold-hi);font-style:italic}
.feed .d{font:500 10px var(--f-mono);color:var(--faint);margin-right:6px}
.quest b{font-weight:500}
.bar{height:2px;background:var(--hair2);margin-top:10px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.ticker{flex:none;border-top:1px solid var(--hair2);background:rgba(8,10,12,.92);height:30px;overflow:hidden;position:relative;white-space:nowrap;font-size:12px}
.ticker .tk{position:absolute;top:0;line-height:30px;animation:mq 80s linear infinite;padding-left:100%}
.ticker .tk span{margin-right:48px;color:#cfc9bd}
.ticker .tk b{font:500 11px var(--f-mono);color:var(--gold);margin-right:8px}
@keyframes mq{to{transform:translateX(-100%)}}

.ov{position:fixed;inset:0;z-index:20;background:rgba(5,6,8,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.win{width:min(1140px,100%);height:auto;min-height:min(540px,100%);max-height:min(880px,100%);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--hair);border-radius:4px;overflow:hidden;box-shadow:0 40px 100px -30px #000;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.win-h{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--hair2);flex:none;background:linear-gradient(180deg,var(--surface2),var(--bg))}
.win-h svg.ic{width:30px;height:30px;color:var(--gold);flex:none}
.win-h h2{font-family:var(--f-serif);font-weight:600;font-size:22px;margin:0;line-height:1.1;letter-spacing:.03em}
.win-h .ws{font-size:12px;color:var(--muted);margin-top:2px}
.win-h .x{margin-left:auto;border:1px solid var(--hair3);background:none;border-radius:3px;height:34px;padding:0 12px;color:var(--muted);font-size:12px;letter-spacing:.08em;flex:none}
.win-h .x:hover{color:var(--ink);border-color:var(--hair)}
.tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--hair2);overflow-x:auto;flex:none}
.tab{border:0;background:none;padding:12px 14px;color:var(--muted);font-size:13px;white-space:nowrap;border-bottom:1px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.wb{flex:1;overflow:auto;padding:18px 20px 24px;min-height:0}
.sec{font-family:var(--f-serif);font-weight:600;font-size:16px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec:first-child{margin-top:0}

.btn{border:1px solid var(--hair3);background:none;color:var(--ink);border-radius:3px;padding:8px 16px;font-size:13px;letter-spacing:.04em;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#16120a;font-weight:500}
.btn.pri:hover{background:var(--gold-hi)}
.btn.buy{background:#a8412f;border-color:#a8412f;color:#fff}
.btn.sell{background:#357a5f;border-color:#357a5f;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.lg{padding:11px 24px;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:1px solid var(--gold-hi);outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:linear-gradient(90deg,var(--gold) var(--p,0%),var(--hair3) var(--p,0%));outline:none;touch-action:none;margin:12px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--gold);box-shadow:0 0 0 3px rgba(200,169,106,.15)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--gold)}
input[type=text]{background:var(--surface);border:1px solid var(--hair3);border-radius:3px;padding:10px 12px;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--hair2);background:none;border-radius:2px;padding:3px 10px;font:500 11px var(--f-mono);color:var(--muted)}
.quick button:hover{color:var(--ink);border-color:var(--hair3)}
.seg2{display:inline-flex;border:1px solid var(--hair3);border-radius:3px;overflow:hidden}
.seg2 button{border:0;background:none;padding:6px 16px;font-size:13px;color:var(--muted)}
.seg2 button.on.b{background:#a8412f;color:#fff} .seg2 button.on.s{background:#357a5f;color:#fff}
.chip{border:1px solid var(--hair3);background:none;border-radius:2px;padding:5px 12px;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold-hi)}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.box{background:var(--surface);border:1px solid var(--hair2);border-radius:4px;padding:14px;min-width:0}
.k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.v{font-family:var(--f-fig);font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:lining-nums}
.tag{display:inline-block;font:500 10.5px var(--f-mono);padding:1px 7px;border:1px solid var(--hair3);border-radius:2px;color:var(--muted);white-space:nowrap;letter-spacing:.04em}
.tag.hot{border-color:var(--up);color:var(--up)} .tag.cold{border-color:var(--down);color:var(--down)} .tag.g{border-color:var(--hair);color:var(--gold)}
.note{font-size:12px;color:var(--muted)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:13px}
.kv span:nth-child(even){text-align:right;font-family:var(--f-mono)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:400;color:var(--muted);text-align:left;font-size:11px;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--hair3);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--hair2);white-space:nowrap;vertical-align:middle}
td.r,th.r{text-align:right}
tr.cl{cursor:pointer}
tr.cl:hover td{background:rgba(236,230,218,.025)}
tr.sel td{background:rgba(200,169,106,.07)}
tr.lk td{color:var(--faint)}
.code{font:500 11px var(--f-mono);color:var(--gold);border:1px solid var(--hair);padding:1px 5px;border-radius:2px;margin-right:8px;display:inline-block;min-width:38px;text-align:center}
canvas.spark{width:90px;height:24px;display:block}
canvas.chart{width:100%;height:230px;display:block}
.ticket{border:1px solid var(--hair);border-radius:4px;padding:16px;margin-top:16px;background:linear-gradient(180deg,var(--surface2),var(--surface));display:flex;flex-direction:column;gap:12px}

.map{border:1px solid var(--hair2);border-radius:4px;background:radial-gradient(ellipse at 60% 40%,#121a22,#0b0d10 70%);overflow:hidden}
.map svg{display:block;width:100%;height:auto;max-height:min(44vh,420px)}
.map text{font-family:var(--f-serif);fill:var(--ink);font-size:13px;paint-order:stroke;stroke:#0b0d10;stroke-width:4px}

.ct{border:1px solid var(--hair2);border-left:2px solid var(--rc);border-radius:4px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:9px}
.ct .tier{font:500 10px var(--f-mono);letter-spacing:.2em;color:var(--rc)}
.ct .cl{font-family:var(--f-serif);font-weight:600;font-size:17px}

.lot{border:1px solid var(--hair2);border-radius:4px;padding:18px;background:linear-gradient(180deg,var(--surface2),var(--surface));display:flex;flex-direction:column;gap:8px;position:relative}
.lot:hover{border-color:var(--hair)}
.lot .ln{font:500 10px var(--f-mono);letter-spacing:.2em;color:var(--faint)}
.lot svg.ic{width:56px;height:56px;color:var(--gold);stroke-width:1;margin:8px 0}
.lot .nm{font-family:var(--f-serif);font-weight:600;font-size:17px}
.lot .pr{font-family:var(--f-fig);font-size:26px;font-weight:600;color:var(--gold-hi);font-variant-numeric:lining-nums}
.lot .own{position:absolute;top:16px;right:16px}

.up-r{display:flex;gap:14px;align-items:flex-start}
.up-r svg.ic{width:30px;height:30px;color:var(--gold);flex:none;margin-top:2px}
.pips{display:flex;gap:3px;margin:6px 0;flex-wrap:wrap}
.pips i{width:14px;height:3px;background:var(--hair3)}
.pips i.on{background:var(--gold)}

.rl{display:flex;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--hair2)}
.rl .no{font-family:var(--f-fig);font-size:26px;width:36px;text-align:center;color:var(--faint);flex:none}
.rl.top3 .no{color:var(--gold)}
.rl.me{background:rgba(200,169,106,.06)}
.av{width:34px;height:34px;border:1px solid var(--hair);display:grid;place-items:center;font-family:var(--f-serif);color:var(--gold);flex:none}

.hon{border:1px solid var(--hair2);border-radius:4px;padding:14px;display:flex;gap:12px;align-items:center;background:var(--surface)}
.hon .md{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair3);display:grid;place-items:center;font-family:var(--f-serif);color:var(--faint);flex:none}
.hon.got .md{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(200,169,106,.1)}
.hon:not(.got){opacity:.55}

.dial{position:relative;width:min(320px,76vw);aspect-ratio:1;margin:0 auto}
.dial svg{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.75,.12,1)}
.dial .ptr{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:16px solid var(--gold);z-index:2}

.felt{position:relative;border-radius:180px/120px;background:radial-gradient(ellipse at 50% 40%,#14503c,var(--felt) 55%,var(--felt2));border:1px solid rgba(200,169,106,.45);box-shadow:inset 0 0 0 8px #1a1410,inset 0 0 0 9px rgba(200,169,106,.35),inset 0 0 60px rgba(0,0,0,.6);padding:30px 28px}
.felt .lgd{text-align:center;font:500 10px var(--f-mono);letter-spacing:.3em;color:rgba(228,203,147,.55)}
.hands{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0}
.hand{text-align:center}
.hand .who{font-family:var(--f-serif);font-size:15px;letter-spacing:.2em}
.hand .pts{font-family:var(--f-fig);font-size:34px;line-height:1;color:var(--gold-hi);min-height:34px}
.cards{display:flex;justify-content:center;gap:6px;min-height:86px;margin-top:8px;flex-wrap:wrap}
.pc{width:58px;height:84px;border-radius:4px;background:#f6f1e6;color:#1b1b1b;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.45);font-family:var(--f-serif);animation:flip .35s ease-out;flex:none}
.pc.red{color:#a8262a}
.pc .r{position:absolute;top:4px;left:6px;font-size:16px;font-weight:700;line-height:1}
.pc .s{position:absolute;top:21px;left:6px;font-size:12px;line-height:1}
.pc .b{position:absolute;right:7px;bottom:6px;font-size:26px;line-height:1}
.pc.back{background:repeating-linear-gradient(45deg,#4a1a20 0 4px,#5a2128 4px 8px);border:3px solid #f6f1e6}
.pc.back::after{content:"";position:absolute;inset:4px;border:1px solid rgba(228,203,147,.6)}
.pc.sm{width:44px;height:64px} .pc.sm .b{font-size:20px} .pc.sm .r{font-size:14px} .pc.sm .s{top:18px}
.pc.dim{filter:brightness(.55)}
@keyframes flip{from{transform:rotateY(90deg) translateY(-6px);opacity:.3}}
.spots{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}
.spots2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.spot{border:1px solid rgba(228,203,147,.45);border-radius:6px;background:rgba(0,0,0,.12);padding:12px 8px;text-align:center;color:var(--ink);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .15s}
.spot:hover{background:rgba(228,203,147,.08)}
.spot .sn{font-family:var(--f-serif);font-size:20px;letter-spacing:.25em}
.spot .po{font:500 10px var(--f-mono);color:rgba(228,203,147,.7);letter-spacing:.1em}
.spot .amt{font-family:var(--f-fig);font-size:18px;color:var(--gold-hi);min-height:22px}

function buyGood(city,g,q){q=Math.floor(q);if(!(q>0))return;const room=whCap(upgLv('wh'))-invUsed(city);
  if(q*G[g].sz>room+1e-9){toast(`${C[city].n}仓库只剩 ${fmtQ(room)} 吨`,'bad');snd('bad');return}
  const qt=quoteBuy(city,g,q);if(qt.total>S.cash){toast('现金不足','bad');snd('bad');return}
  S.cash-=qt.total;S.mkt[city][g].p*=1+qt.impact;const cur=S.inv[city][g]||{q:0,cost:0};S.inv[city][g]={q:cur.q+q,cost:(cur.q*cur.cost+qt.total)/(cur.q+q)};
  S.stats.trades++;if(S.stats.trades>=100)grant('tr100');snd('buy');toast(`买入 ${G[g].n} ${fmtQ(q)}${G[g].u} · ${fmt(qt.total)}`);flag('buy');refresh()}
function sellGood(city,g,q){const cur=S.inv[city][g];if(!cur)return;q=Math.min(Math.floor(q*1000)/1000,cur.q);if(!(q>0))return;const qt=quoteSell(city,g,q);
  S.mkt[city][g].p*=Math.max(.5,1-qt.impact);S.cash+=qt.total;const profit=qt.total-cur.cost*q;cur.q-=q;if(cur.q<1e-6)delete S.inv[city][g];
  S.stats.trades++;S.stats.tradeProfit+=profit;
  if(profit>0){gainXP(profit/500);grant('t1');flag('sellProfit');if(profit>=1e5)grant('p100k');snd('coin');floaty('+'+fmt(profit))}else{snd('bad');floaty(fmt(profit),'var(--down)')}
  if(S.stats.trades>=100)grant('tr100');toast(`卖出 ${G[g].n} · ${profit>=0?'盈利':'亏损'} ${fmt(Math.abs(profit))}`);refresh()}
function ship(from,to,g,q,ins){const cur=S.inv[from][g];if(!cur||from===to)return;q=Math.min(Math.floor(q*1000)/1000,cur.q);if(!(q>0))return;
  if(shipUsed()+q*G[g].sz>fleetCap(upgLv('fleet'))+1e-9){toast('船队运力不足','bad');snd('bad');return}
  const d=shipDays(from,to);const prem=ins?Math.round(cur.cost*q*.016):0;
  const fee=freight(from,to,g,q)+prem;if(fee>S.cash){toast('现金不够付运费','bad');return}
  S.cash-=fee;if(ins)S.stats.insPaid+=prem;const unit=cur.cost+(fee-prem)/q+prem/q;cur.q-=q;if(cur.q<1e-6)delete S.inv[from][g];
  S.ships.push({id:S.shipId++,from,to,good:g,q,unit,dep:S.day,eta:S.day+d,plan:S.day+d,ins:!!ins});

// AI 事件/抉择的数值效果落地（只接受白名单字段，避免模型乱给数）
function applyFx(fx){
  if(!fx||typeof fx!=='object')return[];
  const out=[];
  if(fx.cashPct){const v=Math.round(netWorth()*clamp(+fx.cashPct,-.25,.25));S.cash+=v;out.push(['现金',v])}
  if(fx.prestige){const v=Math.round(clamp(+fx.prestige,-120,180));S.prestige=Math.max(0,S.prestige+v);out.push(['声望',v])}
  if(fx.xpPct){gainXP(Math.round(xpNeed(S.level)*clamp(+fx.xpPct,0,.8)));out.push(['经验','+' ])}
  if(fx.intel){const v=Math.round(clamp(+fx.intel,0,120));S.intel=clamp(S.intel+v,0,INTEL_MAX);out.push(['情报',v])}
  if(fx.debtPct){const v=Math.round(S.loan*clamp(+fx.debtPct,-.5,.5));S.loan=Math.max(0,S.loan-v);out.push(['债务',-v])}
  if(fx.shipDelay){const d=Math.round(clamp(+fx.shipDelay,0,8));for(const s of S.ships)s.eta+=d;if(d)out.push(['船期延误',d+'天'])}
  if(fx.shock&&G[fx.shock.good]){const g=G[fx.shock.good];const mult=clamp(+fx.shock.mult||1,.75,1.4);const days=Math.round(clamp(+fx.shock.days||20,5,45));
    S.events.push({city:null,goods:[g.id],m:mult,until:S.day+days});out.push([g.n,mult>1?'涨':'跌']);}
  return out
}
// 合同议价：无 API 时用本地模型兜底（也是 AI 的校验器基准）
function negotiateLocal(id){
  const o=S.offers.find(x=>x.id===id);if(!o)return null;
  const gap=o.prem-.2;                    // 溢价越高越难再抬
  const p=clamp(.55-gap*1.2,.08,.6);
  if(rnd()<p)return {accept:true,rewardDelta:clamp(gap<0?.12:.05,0,.15),daysDelta:-2,reply:'对方翻了翻计算器，同意小幅上调，但要求期限更紧。'};
  return {accept:false,rewardDelta:0,daysDelta:0,walkAway:rnd()<.1,reply:'对方表示这个价格已经贴着成本，谈不下来。'};
}
// ================= AI · DeepSeek =================
// 设计原则：
//  1) 没有 key 时游戏完整可玩，所有 AI 功能静默降级（议价用本地模型兜底）
//  2) 模型只输出「白名单字段」，数值一律 clamp 后再进游戏，不让模型直接改账
//  3) 所有请求异步、可中断、有超时与重试；不做逐帧调用，只按事件触发
const AI_LS='sh_ai_v1';
const AI=(function(){
  const cfg={key:'',model:'deepseek-chat',base:'https://api.deepseek.com',enabled:true,news:true,taunt:true,mock:false};
  const stat={calls:0,inTok:0,outTok:0,lastErr:'',ok:0,fail:0};
  let aborter=null,busy=false,lastTaunt=-99,lastNewsGen=-99;

  function load(){
    try{const raw=localStorage.getItem(AI_LS);if(raw){const o=JSON.parse(raw);for(const k in cfg)if(o[k]!==undefined)cfg[k]=o[k]}}
    catch(e){}
    try{if(new URLSearchParams(location.search).get('mock')==='1')cfg.mock=true}catch(e){}
    return cfg;
  }
  function saveCfg(){try{localStorage.setItem(AI_LS,JSON.stringify(cfg))}catch(e){saveCfg.lastErr=e.message}}

  const ready=()=>cfg.enabled&&(cfg.mock||!!cfg.key);
  function errText(code,body){
    if(code===401||code===403)return 'DeepSeek 密钥无效或已过期（设置里重新填一次）';
    if(code===402)return 'DeepSeek 账户余额不足';
    if(code===429)return '请求太频繁，稍后再试';
    if(code>=500)return 'DeepSeek 服务端异常，稍后再试';
    return 'DeepSeek 请求失败：'+(body?String(body).slice(0,120):'网络错误');
  }
  // 核心：一次对话（json=true 时要求返回 JSON 对象）
  async function chat(messages,opt={}){
    if(!ready())throw new Error('未配置 DeepSeek 密钥');
    if(cfg.mock)return mockChat(messages,opt);
    const ctl=new AbortController();aborter=ctl;
    const to=setTimeout(()=>ctl.abort(),opt.timeout||60000);
    const body={model:opt.model||cfg.model,messages,temperature:opt.temperature??.7,stream:!!opt.onDelta,max_tokens:opt.max_tokens||900};
    if(opt.json)body.response_format={type:'json_object'};
    let lastErr=null;
    for(let attempt=0;attempt<2;attempt++){
      try{
        const r=await fetch(cfg.base.replace(/\/$/,'')+'/chat/completions',{
          method:'POST',signal:ctl.signal,
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
          body:JSON.stringify(body)});
        if(!r.ok){const txt=await r.text().catch(()=>'');throw new Error(errText(r.status,txt))}
        stat.calls++;
        if(opt.onDelta)return await readStream(r,opt.onDelta);
        const j=await r.json();
        if(j.usage){stat.inTok+=j.usage.prompt_tokens||0;stat.outTok+=j.usage.completion_tokens||0}
        const text=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'';
        stat.ok++;
        return text;
      }catch(e){
        lastErr=e;
        if(e.name==='AbortError')throw new Error('请求超时或被中断');
        if(attempt===0)await new Promise(r=>setTimeout(r,700));
      }
    }
    stat.fail++;stat.lastErr=lastErr&&lastErr.message||'未知错误';
    throw lastErr||new Error('请求失败');
  }
  async function readStream(res,onDelta){
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='',all='';
    for(;;){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n');buf=parts.pop()||'';
      for(const p of parts){
        for(const line of p.split('\n')){
          if(!line.startsWith('data:'))continue;
          const d=line.slice(5).trim();if(d==='[DONE]')continue;
          try{const j=JSON.parse(d);const t=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
            if(t){all+=t;onDelta(t,all)}}catch(e){}
        }
      }
    }
    stat.ok++;return all;
  }
  // JSON 模式下的稳妥解析：容忍代码块、前后缀文本
  function parseJSON(text){
    if(!text)return null;
    let t=String(text).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
    const a=t.indexOf('{'),b=t.lastIndexOf('}');
    if(a<0||b<a)return null;
    try{return JSON.parse(t.slice(a,b+1))}catch(e){return null}
  }
  function abort(){try{aborter&&aborter.abort()}catch(e){}busy=false}

  // ---------- 上下文：给模型的真实状态（紧凑，控制 token） ----------
  function ctx(){
    const nw=netWorth();
    const inv=[];
    for(const c in S.inv){const rows=[];let v=0;
      for(const g in S.inv[c]){const q=S.inv[c][g].q;v+=q*bidP(c,g);if(q>0)rows.push(`${G[g].n}x${Math.round(q)}@成本${Math.round(S.inv[c][g].cost)}`)}
      if(rows.length)inv.push({港:C[c].n,货:rows.slice(0,4),值:Math.round(v)})}
    const best=[];
    for(const g of unlockedGoods())for(const a of unlockedCities())for(const b of unlockedCities()){
      if(a.id===b.id)continue;
      const r=(bidP(b.id,g.id)-askP(a.id,g.id))/askP(a.id,g.id);
      if(r>.01)best.push({货:g.n,买:a.n,卖:b.n,价差:+(r*100).toFixed(1)})}
    best.sort((x,y)=>y.价差-x.价差);
    const mb=macro();
    return {
      公司:S.company,等级:S.level,头衔:TITLES[S.level],第几天:S.day,日期:dateStr(S.day),
      现金:Math.round(S.cash),净资产:Math.round(nw),负债:Math.round(S.loan),授信:Math.round(creditLimit()-S.loan),
      声望:prestigeTotal(),情报点:S.intel,宏观:`${mb.n}（${mb.d}）`,
      日开销:Math.round(dailyCost()),库存:inv,在途: S.ships.map(x=>`${G[x.good].n} ${Math.round(x.q)}${G[x.good].u} ${C[x.from].n}→${C[x.to].n} 还有${x.eta-S.day}天`),
      可交付合同:S.contracts.filter(k=>{const i=S.inv[k.city][k.good];return i&&i.q>=k.q-1e-9}).map(k=>`${k.client} ${G[k.good].n}${Math.round(k.q)} 于${C[k.city].n}`),
      执行中合同:S.contracts.map(k=>`${k.client} ${G[k.good].n}${Math.round(k.q)} 剩${k.due-S.day}天 回款${Math.round(k.reward)}`),
      新订单:S.offers.slice(0,4).map(o=>`#${o.id} ${o.client} ${G[o.good].n}${Math.round(o.q)} 到${C[o.city].n} 期限${o.days}天 回款${Math.round(o.reward)} 溢价${(o.prem*100).toFixed(0)}%`),
      套利机会:best.slice(0,5),
      持仓股票:Object.keys(S.hold).map(k=>`${stockName(k)} ${S.hold[k].q}股 成本${S.hold[k].cost.toFixed(2)} 现价${S.stk[k].p.toFixed(2)}`),
      在途事件:S.events.map(e=>`${(e.goods==='all'?'全品':e.goods.map(g=>G[g].n).join('/'))}${e.city?'@'+C[e.city].n:''} 价格x${e.m.toFixed(2)} 剩${e.until-S.day}天`),
      澳门累计:S.casino.net,
      升级:UPG.map(u=>u.n+upgLv(u.id)).join(' '),
      最近新闻:S.news.slice(0,4).map(n=>`${dateStr(n.d,1)} ${n.t}`)
    };
  }
  const RULES=`你是《商海浮沉》里的家族办公室首席顾问，玩家是上海一家贸易公司的老板。
游戏机制（必须遵守，不要编造）：
- 跨港套利：A港买入价与B港卖出价之差，扣掉运费和买卖价差才是利润；价格冲击随下单量占深度比例上升。
- 合约化：签下大客户订单后在指定港口交付指定数量，回款含溢价（声望越高溢价越高），逾期违约赔 10% 并掉声望。
- 股市：周末休市，±10% 涨跌停，佣金万 2.5，卖出印花税 0.05%。
- 宏观周期影响商品中枢与波动；研究部每日产出情报点，可查未公开消息、价格模型、对手动向。
- 澳门是负期望游戏，只当消遣。
回答要求：简体中文；先给结论；3 条以内要点，每条不超过 40 字；必须引用玩家真实数字（现金、仓位、价差），不要空话；不要输出表格和代码块。`;

  // ---------- 对话式顾问 ----------
  const history=[];
  async function advise(userText,onDelta){
    const sys={role:'system',content:RULES+'\n当前状态 JSON：\n'+JSON.stringify(ctx())};
    const msgs=[sys,...history.slice(-6),{role:'user',content:userText}];
    history.push({role:'user',content:userText});

    return out;
  }
  function resetChat(){history.length=0}

  // ---------- 自然语言下单：解析 → 确认 → 执行 ----------
  const CMD_SYS=`把玩家的话解析成结构化下单指令，只输出 JSON，不要解释。
字段：{"reply":"简短中文回应","actions":[...]}
可用 action（字段严格照抄，数值用阿拉伯数字）：
{"type":"buy","city":"sh|sz|sg|db|sp|rt","good":"rice|soy|steel|cotton|oil|copper|chip|coffee|gold","q":吨数}
{"type":"sell","city":同上,"good":同上,"q":吨数}
{"type":"ship","from":同上,"to":同上,"good":同上,"q":吨数,"ins":true|false}
{"type":"buyStock","code":"股票代码","lots":手数}{"type":"sellStock","code":"...","lots":手数}
{"type":"deliver","id":合同id}{"type":"accept","id":订单id}
{"type":"borrow","amt":金额}{"type":"repay","amt":金额}
{"type":"intel","kind":"event|forecast|rival"}
{"type":"goto","desk":"trade|port|deal|stock|bank|hq|lux|macau|rank|wheel|ach|settings"}
{"type":"say"}   // 当玩家不是在下单，只是聊天，就返回空 actions
规则：玩家没说数量就用 q=0 表示"能买/卖多少就多少"；没说港口就从上下文挑最合理的；看不懂就只返回 {"reply":"...","actions":[]}。最多 3 个 action。城市必须用代码 sh/sz/sg/db/sp/rt。`;
  async function command(text){
    const raw=await chat([{role:'system',content:CMD_SYS+'\n当前状态：\n'+JSON.stringify(ctx())},{role:'user',content:text}],{json:true,temperature:.15,max_tokens:500,tag:'cmd'});

  // 把 action 规整成「可执行 + 可核对」的形式：确认卡上写的，就是真正会执行的
  function describe(a){
    const g=a.good&&G[a.good]?G[a.good]:null,cn=a.city&&C[a.city]?C[a.city].n:'';
    const cityOk=!!(a.city&&C[a.city]),goodOk=!!(a.good&&G[a.good]);
    const bad=t=>({ok:false,t,sub:''});
    switch(a.type){
      case 'buy':{
        if(!cityOk||!goodOk)return bad('港口或品种无效');
        const mx=maxBuy(a.city,a.good);
        if(mx<1)return {ok:false,t:`买入 ${g.n}`,sub:'现金或仓容不足，一吨都买不了'};
        const q=clamp(Math.round(+a.q||0)||mx,1,mx);
        const qt=quoteBuy(a.city,a.good,q);
        return {ok:true,t:`在${cn}买入 ${g.n} ${fmtQ(q)}${g.u}`,sub:`花费 ${fmt(qt.total)} · 均价 ${fmtP(qt.unit)} · 本港最多可买 ${fmtQ(mx)}${g.u}`,act:{...a,q}}}
      case 'sell':{
        if(!cityOk||!goodOk)return bad('港口或品种无效');
        const inv=S.inv[a.city]&&S.inv[a.city][a.good];
        if(!inv||inv.q<=0)return {ok:false,t:`卖出 ${g.n}`,sub:`${cn}没有这个品种的持仓`};
        const q=clamp(Math.round((+a.q||0)||inv.q),0.001,inv.q);
        const total=quoteSell(a.city,a.good,q).total;
        return {ok:true,t:`在${cn}卖出 ${g.n} ${fmtQ(q)}${g.u}`,sub:`收入 ${fmt(total)} · 持仓 ${fmtQ(inv.q)}${g.u}`,act:{...a,q}}}
      case 'ship':{
        if(!cityOk||!goodOk||!C[a.to])return bad('航线无效');
        const inv=S.inv[a.from]&&S.inv[a.from][a.good];
        if(!inv||inv.q<=0)return {ok:false,t:`从${C[a.from].n}发运 ${g.n}`,sub:'起运港没有该品种'};
        const room=Math.max(0,(fleetCap(upgLv('fleet'))-shipUsed())/g.sz);
        const q=Math.min(inv.q,Math.max(0.001,(+a.q||inv.q)),room);
        if(q<0.001)return {ok:false,t:`从${C[a.from].n}发运 ${g.n}`,sub:'船队运力已满'};
        const fee=freight(a.from,a.to,a.good,q);
        return {ok:true,t:`${C[a.from].n} → ${C[a.to].n} 运 ${g.n} ${fmtQ(q)}${g.u}`,
          sub:`运费 ${fmt(fee)} · ${shipDays(a.from,a.to)} 天${a.ins?' · 已投保':''}${q<inv.q?' · 受运力限制已缩量':''}`,act:{...a,q}}}
      case 'buyStock':{
        const k=S.stk[a.code];if(!k)return bad('没有这只票');
        const maxLots=Math.floor(S.cash/(k.p*100*1.001));

        const lots=clamp(Math.round(+a.lots||0)||1,1,maxLots);
        return {ok:true,t:`买入 ${stockName(a.code)} ${lots} 手`,sub:`约 ${fmt(k.p*lots*100)} · 现价 ${k.p.toFixed(2)}`,act:{...a,lots}}}
      case 'sellStock':{
        const h=S.hold[a.code];if(!h)return {ok:false,t:`卖出 ${stockName(a.code)}`,sub:'没有持仓'};
        const lots=clamp(Math.round(+a.lots||0)||Math.floor(h.q/100),1,Math.floor(h.q/100)||1);
        return {ok:true,t:`卖出 ${stockName(a.code)} ${lots} 手`,sub:`持有 ${h.q} 股 · 现价 ${S.stk[a.code].p.toFixed(2)}`,act:{...a,lots}}}
      case 'deliver':{const k=S.contracts.find(x=>x.id===+a.id);return k?{ok:true,t:`向 ${k.client} 交付 ${G[k.good].n}`,sub:`回款 ${fmt(k.reward)}`,act:a}:bad('合同不存在')}
      case 'accept':{const o=S.offers.find(x=>x.id===+a.id);return o?{ok:true,t:`签下 ${o.client} 的订单`,sub:`回款 ${fmt(o.reward)} · 期限 ${o.days} 天`,act:a}:bad('订单已失效')}
      case 'borrow':{const amt=Math.min(Math.max(0,Math.round(+a.amt||0)),Math.max(0,creditLimit()-S.loan));
        return amt>0?{ok:true,t:`申请贷款 ${fmt(amt)}`,sub:'按日计息，随净资产调整授信',act:{...a,amt}}:bad('可用额度不足')}
      case 'repay':{const amt=Math.min(+a.amt||0,S.loan,S.cash);
        return amt>0?{ok:true,t:`还款 ${fmt(amt)}`,sub:`剩余负债 ${fmt(Math.max(0,S.loan-amt))}`,act:{...a,amt}}:bad('没有可还的金额')}
      case 'intel':{const c=INTEL_COST[a.kind]||0;
        if(S.intel<c)return {ok:false,t:'动用情报',sub:`情报点数不足（需 ${c}，现有 ${Math.round(S.intel)}）`};
        return {ok:true,t:`动用情报：${{event:'未公开消息',forecast:'价格模型',rival:'对手动向'}[a.kind]||''}`,sub:`消耗 ${c} 点 · 剩余 ${Math.round(S.intel-c)}`,act:a}}
      case 'goto':return {ok:true,t:`打开「${(WT[a.desk]||[a.desk])[0]}」`,sub:'',act:a};
      default:return bad('无法识别的操作');
    }
  }
  function runAction(a){
    switch(a.type){
      case 'buy':buyGood(a.city,a.good,Math.round(+a.q||0));break;
      case 'sell':sellGood(a.city,a.good,+a.q||0);break;
      case 'ship':ship(a.from,a.to,a.good,+a.q||0,!!a.ins);break;
      case 'buyStock':buyStock(a.code,Math.max(0,+a.lots||0));break;
      case 'sellStock':sellStock(a.code,Math.max(0,+a.lots||0));break;
      case 'deliver':deliver(+a.id);break;

      const mult=clamp(+e.mult||1,.78,1.35),days=Math.round(clamp(+e.days||20,8,40));

        stocks:stock?{[stock]:sm}:null,mkt:0,rate:0,delay:0,at:S.day+2+added,ai:1});
      added++;

  const enc=(cat,ks)=>{let v=cat;for(let i=0;i<5;i++)v=v*13+(ks[i]||0);return v};
  const fs=sc.findIndex(n=>n>=5);let flush;

  $('#modalRoot').innerHTML=`<div class="mbg"><div class="modal" role="dialog" aria-modal="true">${fn()}</div></div>`;
  $('#modalRoot').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{snd('click');resolveAsk(null);closeModal()});
  $('#modalRoot').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{snd('click');const i=+b.dataset.act;closeModal();onAct&&onAct(i)});
  after&&after();const f=$('#modalRoot .modal button:not([disabled])');f&&f.focus({preventScroll:true})}

// 图表数据走 CH 注册表（不再把数组 JSON 塞进 data-* 属性），并带签名跳过无变化重绘
const CH_SIG=new WeakMap();
function drawCharts(root){
  if(!root)return;
  const up='#d8604e',down='#4f9f80',muted='#8f8a80',gold='#c8a96a';
  const prep=cv=>{const dpr=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return [null];
    const W=Math.round(w*dpr),H=Math.round(h*dpr);
    if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
    const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);return [x,w,h]};
  root.querySelectorAll('canvas.spark').forEach(cv=>{
    const d=CH.get(cv.dataset.cid);if(!d||d.length<2)return;
    const sig='s'+d.length+'|'+d[0]+'|'+d[d.length-1];
    if(CH_SIG.get(cv)===sig)return;CH_SIG.set(cv,sig);
    const [x,w,h]=prep(cv);if(!x)return;
    let mn=Infinity,mx=-Infinity;for(const v of d){if(v<mn)mn=v;if(v>mx)mx=v}
    const r=(mx-mn)||1,col=d[d.length-1]>=d[0]?up:down;
    x.beginPath();for(let i=0;i<d.length;i++){const X=i/(d.length-1)*w,Y=2+(1-(d[i]-mn)/r)*(h-4);i?x.lineTo(X,Y):x.moveTo(X,Y)}
    x.strokeStyle=col;x.lineWidth=1.1;x.stroke()});
  root.querySelectorAll('canvas.chart,canvas[data-cid]').forEach(cv=>{
    if(cv.classList.contains('spark'))return;
    const cid=cv.dataset.cid;const d=cid?CH.get(cid):null;if(!d||d.length<2)return;
    const isK=Array.isArray(d[0]);
    const sig=(isK?'k':'l')+d.length+'|'+(isK?d[d.length-1][3]:d[d.length-1])+'|'+cv.clientWidth+'x'+cv.clientHeight;
    if(CH_SIG.get(cv)===sig)return;CH_SIG.set(cv,sig);
    const [x,w,h]=prep(cv);if(!x)return;
    if(isK){
      const pad={l:4,r:54,t:8,b:8};let mn=Infinity,mx=-Infinity;
      for(const c of d){if(c[2]<mn)mn=c[2];if(c[1]>mx)mx=c[1]}
      const rr=(mx-mn)||1;mn-=rr*.05;mx+=rr*.05;
      const cw=(w-pad.l-pad.r)/d.length,Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(h-pad.t-pad.b);
      x.font='10.5px "IBM Plex Mono", monospace';x.fillStyle=muted;x.strokeStyle='rgba(236,230,218,.05)';
      for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);x.beginPath();x.moveTo(pad.l,y);x.lineTo(w-pad.r,y);x.stroke();x.fillText(v.toFixed(2),w-pad.r+8,y+4)}
      for(let i=0;i<d.length;i++){const [o,hi,lo,cl]=d[i];const col=cl>=o?up:down;const cx=pad.l+i*cw+cw/2;
        x.strokeStyle=col;x.fillStyle=col;x.lineWidth=1;x.beginPath();x.moveTo(cx,Y(hi));x.lineTo(cx,Y(lo));x.stroke();
        const y1=Y(Math.max(o,cl)),y2=Y(Math.min(o,cl));x.fillRect(cx-cw*.32,y1,cw*.64,Math.max(1,y2-y1))}
      x.beginPath();let s=0;for(let i=0;i<d.length;i++){s+=d[i][3];if(i>=5)s-=d[i-5][3];if(i>=4){const cx=pad.l+i*cw+cw/2;i===4?x.moveTo(cx,Y(s/5)):x.lineTo(cx,Y(s/5))}}
      x.strokeStyle=gold;x.lineWidth=1.2;x.stroke();
      return;
    }
    const mini=cv._mini;const pad=mini?{l:2,r:2,t:6,b:6}:{l:4,r:70,t:10,b:10};
    let mn=Infinity,mx=-Infinity;for(const v of d){if(v<mn)mn=v;if(v>mx)mx=v}
    if(mx===mn){mx+=1;mn-=1}
    const rr=mx-mn;mn-=rr*.08;mx+=rr*.08;
    const X=i=>pad.l+i/(d.length-1)*(w-pad.l-pad.r),Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(h-pad.t-pad.b);
    const col=mini?gold:(d[d.length-1]>=d[0]?up:down);
    const money=Math.max(Math.abs(mx),Math.abs(mn))>1e5;
    if(!mini){x.font='10.5px "IBM Plex Mono", monospace';x.fillStyle=muted;x.strokeStyle='rgba(236,230,218,.05)';
      for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);x.beginPath();x.moveTo(pad.l,y);x.lineTo(w-pad.r,y);x.stroke();x.fillText(money?fmt(v):fmtP(v),w-pad.r+8,y+4)}}
    const gr=x.createLinearGradient(0,pad.t,0,h);gr.addColorStop(0,col+'33');gr.addColorStop(1,col+'00');
    x.beginPath();for(let i=0;i<d.length;i++){i?x.lineTo(X(i),Y(d[i])):x.moveTo(X(i),Y(d[i]))}
    x.strokeStyle=col;x.lineWidth=mini?1.3:1.4;x.stroke();
    x.lineTo(X(d.length-1),h-pad.b);x.lineTo(X(0),h-pad.b);x.closePath();x.fillStyle=gr;x.fill();
    if(!mini){x.beginPath();x.arc(X(d.length-1),Y(d[d.length-1]),2.8,0,7);x.fillStyle=col;x.fill()}
  });
}

// ================= TRADE TICKET =================
function ticket(){const g=G[ui.good],c=ui.city,inv=S.inv[c][ui.good];const q=tradeQ();
  const qt=q>0?(ui.mode==='b'?quoteBuy(c,ui.good,q):quoteSell(c,ui.good,q)):null;const profit=ui.mode==='s'&&inv&&qt?qt.total-inv.cost*q:null;const m=S.mkt[c][ui.good];
  CH.set('ticket',m.h);
  // 跨港套利提示：直接给出扣运费后净利最高的目的地
  let hint='';if(ui.mode==='b'){
    let best=null;
    for(const t of unlockedCities()){if(t.id===c)continue;
      const qq=Math.max(1,q||1);const gain=(bidP(t.id,ui.good)-askP(c,ui.good))*qq-freight(c,t.id,ui.good,qq);
      if(!best||gain>best.gain)best={c:t,gain}}
    if(best&&best.gain>0)hint=`运到${best.c.n}卖，扣运费后净赚 <span class="gold">${fmt(best.gain)}</span> <button class="chip" type="button" data-shipfast="${ui.good}:${best.c.id}">安排</button>`}
  return `<div class="ticket"><div class="sp" style="flex-wrap:wrap"><div><span class="code">${g.code}</span><b style="font-family:var(--f-serif);font-size:18px;font-weight:600">${g.n} · ${C[c].n}</b><div class="note" style="margin-top:4px">买价 <span class="m">${fmtP(askP(c,g.id))}</span> · 卖价 <span class="m">${fmtP(bidP(c,g.id))}</span> / ${g.u}${inv?` · 持仓 <span class="m">${fmtQ(inv.q)}</span> · 成本 <span class="m">${fmtP(inv.cost)}</span>`:''}</div></div>
   <div class="seg2"><button type="button" class="b ${ui.mode==='b'?'on':''}" data-mode="b">买入</button><button type="button" class="s ${ui.mode==='s'?'on':''}" data-mode="s">卖出</button></div></div>
   ${hint?`<div class="note">${hint}</div>`:''}
   <canvas class="chart" style="height:150px" data-cid="ticket"></canvas>
   <div><div class="sp"><span class="k">${ui.mode==='b'?'买入数量（受现金与仓容限制）':'卖出数量'}</span><span class="m" style="font-size:15px" id="liveQ">${fmtQ(q)} ${g.u}</span></div><input type="range" min="0" max="100" value="${ui.pct}" data-range="pct" style="--p:${ui.pct}%" aria-label="数量比例"><div class="quick">${[10,25,50,100].map(v=>`<button type="button" data-pctset="pct:${v}">${v===100?'最大':v+'%'}</button>`).join('')}</div></div>
   <div class="sp" style="flex-wrap:wrap"><div class="kv">${qt?`<span class="muted">成交均价</span><span>${fmtP(qt.unit)}</span><span class="muted">${ui.mode==='b'?'成交金额':'成交收入'}</span><span>${fmt(qt.total)}</span><span class="muted">价格冲击 <span class="tip" data-t="你这一单占该港该品种深度的比例，越大越吃亏">?</span></span><span>${pct(qt.impact,1)}</span>${profit!=null?`<span class="muted">本笔盈亏</span><span class="${cls(profit)}">${fmt(profit)}</span>`:''}`:`<span class="muted">${ui.mode==='b'?'现金或仓容不足':'本港无持仓'}</span><span></span>`}</div>
   <button class="btn lg ${ui.mode==='b'?'buy':'sell'}" type="button" data-gtrade ${q>0?'':'disabled'}>${ui.mode==='b'?'确认买入':'确认卖出'}</button></div></div>`}

function routePath(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,k=.18;return `M${a.x} ${a.y} Q${(mx-dy*k).toFixed(1)} ${(my+dx*k).toFixed(1)} ${b.x} ${b.y}`}
function qpt(a,b,t){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,k=.18;const cx=mx-dy*k,cy=my+dx*k;const u=1-t;return {x:u*u*a.x+2*u*t*cx+t*t*b.x,y:u*u*a.y+2*u*t*cy+t*t*b.y}}
let shipRAF=0;
function drawShips(){cancelAnimationFrame(shipRAF);const layer=document.getElementById('shipLayer');if(!layer||win!=='port')return;
  const frac=speed&&!modalOpen?clamp((performance.now()-lastTick)/(3000/speed),0,1):0;
  layer.innerHTML=S.ships.map(s=>{const t=clamp((S.day+frac-s.dep)/(s.eta-s.dep),0,1);const a=C[s.from],b=C[s.to];const p=qpt(a,b,t),p2=qpt(a,b,Math.min(1,t+.01)),p0=qpt(a,b,Math.max(0,t-.01));const ang=Math.atan2(p2.y-p0.y,p2.x-p0.x)*180/Math.PI;
    return `<g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${ang.toFixed(0)})"><path d="M-8 -3h11l4 3-4 3h-11z" fill="#e4cb93"/></g>`}).join('');
  if(!reduce)shipRAF=requestAnimationFrame(drawShips)}

function mdLite(s){

async function sendAI(){
  const inp=$('#aiIn');if(!inp||CHAT.busy)return;
  const text=(inp.value||'').trim();if(!text)return;
  inp.value='';inp.style.height='auto';
  pushMsg('u',text);
  if(CHAT.mode==='cmd')return runCommand(text);
  CHAT.busy=true;AI.busy=true;snd('ai');
  const bubble=pushMsg('a','');
  const el=bubble;let acc='';
  const finish=txt=>{CHAT.busy=false;AI.busy=false;if(el)el.innerHTML=mdLite(txt||'没拿到回复');const b=$('#aiBody');if(b)b.scrollTop=b.scrollHeight};
  if(!AI.ready()){
    CHAT.busy=false;AI.busy=false;
    return finish('还没配置 DeepSeek 密钥，我目前只能用内置的本地规则：\n1. 想让我真正读懂盘面，去「设置 → API 密钥」填一个。\n2. 现在可以直接在「下令」里说人话，本地解析也能下单。\n3. 想先看效果，就在设置里开「演示模式」。');
  }

    grant('ai');
    finish(acc);
    if(el){el.dataset.text=acc}
  }catch(e){
    pushMsg('e',e.message||'请求失败');
    if(el)el.remove();
  }finally{CHAT.busy=false;AI.busy=false}
}
// 下令 → 确认 → 执行
async function runCommand(text){
  CHAT.busy=true;
  const think=pushMsg('a','解析中…');
  let res=null;
  try{
    res=AI.ready()?await AI.command(text):AI.localCommand(text);
  }catch(e){
    res=AI.localCommand(text);
  }
  CHAT.busy=false;
  if(think)think.remove();
  if(!res||!res.actions||!res.actions.length){
    return pushMsg('a',(res&&res.reply)||'这句我听不出要做什么。可以说「在深圳买 500 吨大豆」「把上海的铜运到鹿特丹」「买入 20 手华信科技」。');
  }
  const items=res.actions.map(a=>({a,d:AI.describe(a)}));
  CHAT.pending=items;
  const box=$('#aiBody');
  const el=document.createElement('div');el.className='msg a';el.id='aiConfirm';
  el.innerHTML=mdLite(res.reply||'确认一下：')+'<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">'+
    items.map((it,i)=>`<div style="border:1px solid var(--hair2);border-radius:3px;padding:7px 9px;${it.d.ok?'':'opacity:.55'}"><div>${i+1}. ${esc(it.d.t)}</div>${it.d.sub?`<div class="note">${esc(it.d.sub)}</div>`:''}</div>`).join('')+

function execPending(){
  const items=CHAT.pending;if(!items)return;
  let n=0;
  for(const it of items){if(!it.d.ok)continue;try{AI.runAction(it.d.act||it.a);n++}catch(e){toast('执行失败：'+e.message,'bad')}}
  CHAT.pending=null;
  const el=$('#aiConfirm');if(el){el.innerHTML=mdLite(n?`已执行 ${n} 项操作。`:'这些操作当前没法执行（现金/库存不足）。')}
  snd(n?'coin':'bad');toast(n?`已执行 ${n} 项操作`:'没有可执行的操作',n?'lv':'bad');refresh();
}

async function negotiateOffer(id){
  const o=S.offers.find(x=>x.id===id);if(!o)return;
  const demand=await askText({cap:'Negotiation',title:`与 ${o.client} 谈条件`,
    body:`当前回款 <b class="gold">${fmt(o.reward)}</b> · 期限 ${o.days} 天 · 交付 ${C[o.city].n}。`,
    placeholder:'例如：价格再上浮 10%，期限给我 20 天',
    cta:AI.ready()?'发出去':'用内置模型谈',
    hint:AI.ready()?'':'未配置密钥：使用内置议价模型（规则式，不消耗 API）'});
  if(!demand)return;
  toast('谈判中…');snd('click');
  let r=null;
  if(AI.ready()){try{r=await AI.negotiate(o,demand)}catch(e){toast('AI 谈判失败，改用内置模型','bad')}}
  if(!r)r=negotiateLocal(id);
  if(!r){toast('谈判没结果');return}
  if(r.walkAway){
    S.offers=S.offers.filter(x=>x.id!==id);S.prestige=Math.max(0,S.prestige-5);
    news(`${o.client}中止了与${S.company}的谈判`,'bad');snd('bad');
    queueModal(()=>`<div class="cap">Negotiation</div><h2>谈崩了</h2><div class="rule"></div><p>${esc(r.reply||'对方直接结束了会谈。')}</p><button class="btn pri lg" type="button" data-close>回去干活</button>`);
    refresh();return;
  }
  if(r.accept){
    const nr=Math.max(1000,Math.round(o.reward*(1+r.rewardDelta)/100)*100);
    o.reward=nr;o.days=Math.max(4,o.days+(r.daysDelta||0));
    o.prem=Math.max(.02,o.prem+r.rewardDelta);
    S.stats.nego++;grant('nego');snd('coin');
    news(`${o.client}接受新条款，回款调整为 ${fmt(nr)}`,'good');
  }else snd('bad');
  queueModal(()=>`<div class="cap">Negotiation</div><h2>${r.accept?'谈成了':'没谈成'}</h2><div class="rule"></div>
    <p style="text-align:left">${esc(r.reply||'')}</p>
    ${r.accept?`<div class="kv" style="text-align:left"><span class="muted">新回款</span><span class="gold">${fmt(o.reward)}</span><span class="muted">新期限</span><span>${o.days} 天</span></div>`:''}
    <button class="btn pri lg" type="button" data-close>${r.accept?'签下':'知道了'}</button>`);
  refresh();
}

  if(d.room){CS.room=d.room;CS.chip=0;CS.sl.bet=0;if(CS.phase==='done')baccReset();snd('click');rw();return}
  if(d.chip){CS.chip=+d.chip;snd('chip');rw();return}
  if(d.bet){baccPlace(d.bet);return}
  if('bclear' in d){baccClear();return}
  if('rebet' in d){baccRebet();return}
  if('deal' in d){baccDeal();return}
  if(d.sbet){if(CS.sl.spinning)return;CS.sl.bet=+d.sbet;snd('chip');rw();return}
  if('spinslot' in d){slotSpin();return}
  if('sit' in d){hdSit();return}
  if('hdleave' in d){hdLeave();return}
  if('hdnext' in d){hdNewHand();return}
  if(d.hda){if(!HD||HD.toAct!==0)return;hdAct(0,d.hda,+d.to||0);return}
});
document.addEventListener('click',e=>{const tr=e.target.closest&&e.target.closest('tr[data-sp]');if(!tr||!S)return;
  if(win||modalOpen)return;
  if(!goodUnlocked(tr.dataset.sp))return;
  ui.good=tr.dataset.sp;ui.mode='b';ui.pct=30;openWin('trade');snd('click')});

// AI 悬浮按钮
if($('#aiFab'))$('#aiFab').onclick=()=>{if(!S||!S.started)return;snd('click');CHAT.open?closeAI():openAI()};

// ================= KEYBOARD =================
function togglePause(){if(!S||!S.started)return;if(S.inMacau){toast('身在澳门，商业时间暂停');return}setSpeed(speed?0:1);snd('click')}
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='Escape'){
    if(modalOpen)return;
    if(CHAT.open){closeAI();return}
    if(win&&win!=='macau')closeWin();
    return}
  if(!S||!S.started)return;
  if(k===' '){e.preventDefault();togglePause();return}
  if(k==='a'||k==='A'){e.preventDefault();CHAT.open?closeAI():openAI();return}
  if(k==='s'||k==='S'){if(win==='settings')closeWin();else{if(win)closeWin();openWin('settings')}return}
  if(k==='m'||k==='M'){muted=!muted;try{localStorage.setItem('sh_mute',muted?'1':'0')}catch(err){}paintTop();return}
  if(k==='?'){if(win)closeWin();openWin('settings');return}
  if(/^[1-9]$/.test(k)){const d=DESKS.find(x=>x.k===k);if(!d)return;if(win)closeWin();openWin(d.id)}
});

// ================= BOOT =================
function setSpeed(s){speed=s;clearInterval(timer);if(s>0)timer=setInterval(()=>{if(!document.hidden&&!modalOpen&&S&&S.started&&!S.inMacau)tick()},3000/s);
  try{localStorage.setItem('sh_speed',String(s))}catch(e){}
  if(S){const seg=$('#speedSeg');if(seg)seg.querySelectorAll('[data-speed]').forEach(b=>{const on=+b.dataset.speed===s;if(b.classList.contains('on')!==on)b.classList.toggle('on',on)})}}
function gameOver(){setSpeed(0);queueModal(()=>`<div class="cap">Liquidation</div><h2>${esc(S.company)} 破产清算</h2><div class="rule"></div><p>经营 ${S.day} 天，最高净资产 <span class="gold">${fmt(S.stats.maxNW)}</span>。</p><button class="btn pri lg" type="button" data-act="0">重新创业</button>`,()=>{try{localStorage.removeItem(LS)}catch(e){}startScreen()})}
function startScreen(rename){if(!rename)setSpeed(0);
  queueModal(()=>`<div class="cap">${rename?'Company':'Shanghai · January 2026'}</div><h2>${rename?'更改公司名称':'创办你的贸易公司'}</h2><div class="rule"></div>${rename?'':'<p>启动资金 ¥15 万。在六大港口之间低买高卖大宗商品，承接大客户合同，投资 A 股，与四家 AI 财团及其他真人玩家角逐富豪榜。闲暇时，可以飞往澳门。</p><p class="note">按 A 唤起 AI 智囊；按 ? 看快捷键。</p>'}
   <input type="text" id="nameIn" maxlength="16" aria-label="公司名称" value="${rename?esc(S.company):esc(pick(['恒远','金帆','瑞丰','鸿运','华兴','万和'])+'贸易有限公司')}" style="text-align:center;font-size:16px;font-family:var(--f-serif)">
   <button class="btn pri lg" type="button" id="startBtn">${rename?'保存':'注册开业'}</button>`,null,()=>{
  $('#startBtn').onclick=()=>{const n=($('#nameIn').value||'').trim()||'无名贸易行';
    if(rename){S.company=n;closeModal();save();pushPlayer(true);refresh();return}
    S=newGame(n);S.started=true;news(`${n}在上海正式开业`,'gold');news('提示：交易所「调货到」一列会显示跨港价差','');for(let i=0;i<3;i++)genOffer();
    S.month={start:0,nw:netWorth(),trade0:0,stock0:0,cas0:0,cost0:0,intr0:0};
    closeModal();snd('lv');setSpeed(1);save();pushPlayer(true);refresh()}})}

// 背景：静态绘制一次（resize 才重画），不参与每帧
const bgc=$('#bgc');
function drawBG(){if(!bgc)return;const W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1);
  bgc.width=W*dpr;bgc.height=H*dpr;const x=bgc.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const g=x.createRadialGradient(W*.7,-H*.1,0,W*.7,-H*.1,Math.max(W,H)*1.1);g.addColorStop(0,'#1a1712');g.addColorStop(.5,'#0e1013');g.addColorStop(1,'#0a0b0d');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(200,169,106,.05)';x.lineWidth=.6;const cx=W*.82,cy=H*.18,R=Math.min(W,H)*.42;
  for(let k=0;k<26;k++){x.beginPath();for(let t=0;t<=Math.PI*2+.01;t+=.02){const r=R*(.55+.45*Math.cos(7*t+k*.24))*(.7+k*.012);const px=cx+r*Math.cos(t+k*.03),py=cy+r*Math.sin(t+k*.03);t?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}}
drawBG();

let __rz=0;
window.addEventListener('resize',()=>{clearTimeout(__rz);__rz=setTimeout(()=>{
  drawBG();
  if(win){const b=$('#wb');if(b){b._h='';renderWin(true)}}
  const m=$('#main');if(m){m._h='';paintMain()}
  tk.boxW=0;tk.x=0},160)});

// 常驻帧循环：进度条 + 跑马灯（统一带宽高控制，只有一处 rAF）
let __lastFrame=performance.now();
(function loop(t){
  const dt=Math.min(120,t-__lastFrame);__lastFrame=t;
  if(S){
    const f=$('#dayFill');
    if(f){const p=speed&&!modalOpen&&!S.inMacau&&S.started?clamp((performance.now()-lastTick)/(3000/speed),0,1):0;const w=(p*100).toFixed(1)+'%';if(f.style.width!==w)f.style.width=w}
    tickerStep(dt);
  }
  requestAnimationFrame(loop);
})(performance.now());

function start(data){
  let loaded=data&&data.state;
  if(!loaded){try{const raw=localStorage.getItem(LS);if(raw)loaded=JSON.parse(raw)}catch(e){}}
  if(loaded&&loaded.started){
    S=migrate(loaded);S.inMacau=false;
    if(data&&data.ui)Object.assign(ui,data.ui);
    else if(S.ui)Object.assign(ui,S.ui);
    refresh();setSpeed(1);
    if(data&&data.win&&data.win!=='macau')openWin(data.win);
  }else{
    S=newGame('商海浮沉');for(let i=0;i<3;i++)genOffer();refresh();startScreen();
  }
  initCloud();
}
// 调试/自动化钩子（不影响正常玩法）
Object.defineProperty(window,'__S',{get:()=>S});
window.__nw=()=>netWorth();
window.__tick=()=>{tick();return S.day};
window.__AI=AI;
window.__ui=ui;
window.__T={clearModals(){mq.length=0;modalOpen=false;const m=$('#modalRoot');if(m)m.innerHTML=''},
  open:openWin,close:closeWin,isModal:()=>modalOpen,
  modalText(){const m=$('#modalRoot .modal');return m?m.textContent:''},
  addDay(n){for(let i=0;i<(n||1);i++)tick()},refresh(){refresh()},ui,speed:()=>speed,winId:()=>win,modalOpen:()=>modalOpen,mqLen:()=>mq.length,
  flush(){flush()},frame(){tick();flush()},toast:(t,k)=>toast(t,k)};

window.claude?.hot?.snapshot?.(()=>({state:JSON.parse(snapshot()),ui,win}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
